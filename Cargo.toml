# The site is a member rather than a separate repository: it is generated from
# the program -- the palette from src/theme.rs, the screens from the real
# binary -- so it has to be built against the same source tree.
[workspace]
members = ["site"]

[package]
name = "dirk"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal multiplexer with a clickable project tree, static pages and intent-based workspace naming built in."
readme = "README.md"
repository = "https://github.com/oddurs/dirk"
homepage = "https://github.com/oddurs/dirk"
keywords = ["terminal", "multiplexer", "tui", "pty", "tmux"]
categories = ["command-line-utilities"]
# Let-chains, which this uses throughout.
rust-version = "1.88"
exclude = ["/cairn", "/.github", "/.claude", "/.githooks", "/scripts", "/site"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29"
libc = "0.2.189"
portable-pty = "0.9"
ratatui = "0.30"
# Only for `pane wait-output --regex`, and deliberately for that: this engine
# has no backtracking, so a pattern out of a caller's shell cannot be made to
# take exponential time in the session that holds every one of their panes.
# Written by hand, it would be a worse engine with that property missing.
regex = { version = "1.13.1", default-features = false, features = [
  "std",
  "perf",
  "unicode-perl",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
libc = "0.2.189"
portable-pty = "0.9"

# Chosen rather than adopted wholesale. The pedantic set finds about three
# hundred more things than the default one and disagrees with this project's
# style on purpose for most of them — a `match` on a boolean is an idiom here,
# and a lint set nobody agrees with is a lint set people learn to override.
#
# What is here either locks in something the tree already does or catches
# something that should never ship. Each says why.
[lints.clippy]
# There is not one of these in `src`, and that is worth keeping rather than
# rediscovering. A panic in a session holding somebody's shells and agents ends
# all of them; every fallible thing in the program handles its failure, and this
# is what says so. `clippy.toml` allows them where a panic is an assertion.
unwrap_used = "deny"
expect_used = "deny"
# `x.to_path_buf()` on something that is already a `PathBuf`, `x.to_string()` on
# a `String`. Both say "convert" where what is happening is a copy, which is the
# kind of small wrongness that makes a line harder to read than it needs to be.
implicit_clone = "deny"
# None of these exist, and none of them should reach a release: a stub that
# panics, and a debug print in a program that draws a terminal.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
