[package]
name = "dirk"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal multiplexer with a clickable project tree, static pages and intent-based workspace naming built in."
readme = "README.md"
repository = "https://github.com/oddurs/dirk"
homepage = "https://github.com/oddurs/dirk"
keywords = ["terminal", "multiplexer", "tui", "pty", "tmux"]
categories = ["command-line-utilities"]
# Let-chains, which this uses throughout.
rust-version = "1.88"
exclude = ["/cairn", "/.github"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29"
libc = "0.2.189"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "0.9"
vt100 = "0.16"

[dev-dependencies]
libc = "0.2.189"
portable-pty = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
