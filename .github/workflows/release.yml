# A tag cuts a release. NEWS is the changelog, so the notes are taken from it
# rather than written a second time, and nothing is built until the tag,
# Cargo.toml, the manual page and NEWS agree about which version this is — a
# release whose notes belong to a different version is worse than no release.
name: release

on:
  push:
    tags: ["v*"]
  # For re-cutting a release whose upload failed, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build, e.g. v0.5.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: v
        name: the tag, Cargo.toml, the manual page and NEWS must agree
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          version=${tag#v}
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$declared" = "$version" ] \
            || { echo "::error::Cargo.toml declares $declared, the tag says $version"; exit 1; }

          documented=$(sed -n 's/^\.TH DIRK 1 .* "dirk \(.*\)" .*/\1/p' doc/dirk.1 | head -1)
          [ "$documented" = "$version" ] \
            || { echo "::error::doc/dirk.1 documents $documented, the tag says $version"; exit 1; }

          scripts/news "$version" > /dev/null \
            || { echo "::error::NEWS has no section for $version"; exit 1; }

          echo "$version, agreed by all four."

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          # Statically linked, for a machine whose glibc is older than the
          # runner's. The one build that will run anywhere.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-latest,     target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Each tarball is self-contained: the binary, the manual page, and the
      # files a stranger needs in order to know what they have and what they
      # may do with it.
      - name: tarball
        run: |
          version='${{ needs.verify.outputs.version }}'
          name="dirk-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/dirk" "dist/$name/"
          cp doc/dirk.1 "dist/$name/"
          cp README.md NEWS AUTHORS THANKS INSTALL COPYING "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dirk-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  source:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          # make dist generates the ChangeLog from the history, so it needs one.
          fetch-depth: 0

      - run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: dirk-source
          path: dirk-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One file, so a download can be verified without knowing which tarball
      # it came from.
      - name: checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS

      - name: release notes
        run: |
          version='${{ needs.verify.outputs.version }}'
          scripts/news "$version" > notes.md
          cat >> notes.md <<'FOOTER'

          ---

          Verify a download with `sha256sum --check --ignore-missing SHA256SUMS`.
          FOOTER
          echo "Installing: see [INSTALL](https://github.com/${{ github.repository }}/blob/${{ needs.verify.outputs.tag }}/INSTALL)." >> notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ needs.verify.outputs.tag }}' \
            --title 'dirk ${{ needs.verify.outputs.version }}' \
            --notes-file notes.md \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS
