# The website, deployed from the workflow rather than from a branch.
#
# The site is generated from the repository — the palette out of src/theme.rs,
# the roadmap out of cairn's rendered file, the changelog out of NEWS — so the
# paths that trigger it are wider than site/ alone. A colour changed in the
# program is a change to the site.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/theme.rs"
      - "ROADMAP.md"
      - "NEWS"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelling one that is in flight: a
# half-uploaded site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: site

      # Project pages live under /dirk/. Every link and asset is written with
      # that prefix; getting it wrong produces a site whose links all work
      # locally and none work here.
      - run: cargo run --release --locked -p site -- build --base /dirk/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
