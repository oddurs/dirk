name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints are platform-independent, so they run once rather than
  # once per operating system.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # dirk is a program about pseudo-terminals, and tests/smoke.rs drives the real
  # binary on a real one. Both supported platforms therefore run the full suite;
  # a pty difference between them is exactly the kind of bug worth catching.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: macos }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test
      - run: cargo build --release

  # Everything a release ships, compiled on a pull request rather than on a tag.
  #
  # The tag is what triggers a release build, so a target nobody checks is a
  # target that fails partway through publishing. That is not hypothetical:
  # dirk stopped compiling for aarch64 Linux the day the window title landed and
  # nothing noticed, because CI built one target and the release builds five.
  #
  # `check` rather than `build`: the question is whether the code is valid for
  # the target, which needs its standard library and no linker.
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # Read out of release.yml rather than written here. Two lists is one list
      # and a copy of it, and the copy is what goes stale -- which is the whole
      # failure this job exists to prevent.
      - id: read
        run: |
          list=$(sed -n 's/^ *- { *os:[^,]*, *target: *\([a-z0-9_-]*\).*/\1/p' \
            .github/workflows/release.yml | sort -u | jq -R . | jq -sc .)
          count=$(printf '%s' "$list" | jq length)
          # Loudly rather than quietly: a release.yml somebody reformatted would
          # otherwise leave this job checking nothing at all and passing.
          if [ "$count" -lt 2 ]; then
            echo "::error::found $count targets in release.yml; the matrix moved"
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "checking $count targets: $list"

  cross:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      # The binary, which is what is shipped. Not `--all-targets`: the test
      # binaries are not in the tarball, and cross-compiling them would put
      # the dev-dependencies in the way of a question about the program.
      - run: cargo check --target ${{ matrix.target }}

  # The declared rust-version is a promise; this checks it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets

  # Almost every type in dirk carries an argument for why it is shaped the way
  # it is, so the documentation is load-bearing rather than decorative. This
  # catches the ways it rots quietly: a link to something that was renamed, a
  # code block that stopped compiling, a doc comment on an item that went.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --no-deps --document-private-items

  # What ships and is not Rust: the manual page, the shell that drives the
  # workflow, and the commit messages. All three take seconds.
  shipped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The attribution check needs a merge base to compare against.
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mandoc
      - name: the manual page parses
        run: mandoc -T lint doc/dirk.1
      - name: the scripts and hooks are clean
        # Warnings and up. The info level is where shellcheck versions
        # disagree with each other, and a CI job that fails when the runner
        # image bumps a linter is a job nobody trusts.
        run: shellcheck -S warning scripts/work scripts/news .githooks/commit-msg .githooks/pre-push
      # Two branches filing backlog items pick the same next id, and because
      # the filenames differ git merges them without a conflict. `cairn check`
      # catches it and CI does not have cairn; this catches the one failure
      # mode that actually bites, in one line and with no dependency.
      - name: no two backlog items share an id
        run: |
          ids=$(find cairn/items -name '*.md' -exec basename {} \; | sed 's/^\([0-9]*\).*/\1/')
          dupes=$(printf '%s\n' "$ids" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate item ids: $dupes — run \`cairn renumber\`, then check depends_on by hand"
            exit 1
          fi
          printf '%s\n' "$ids" | wc -l | xargs echo items, all distinct:

      - name: no tool attribution in the history this branch adds
        run: |
          base=$(git merge-base origin/${{ github.base_ref || 'main' }} HEAD 2>/dev/null || echo HEAD~1)
          if git log --format=%B "$base..HEAD" | grep -niE 'co-authored-by:.*(claude|anthropic|copilot|cursor)|generated with \[*claude'; then
            echo "::error::a commit on this branch credits a tool; .githooks/commit-msg strips these — run make setup"
            exit 1
          fi
          echo "clean"

  # The site is built on every pull request and deployed on none of them: a
  # change that breaks it should fail in review rather than after the merge.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: site
      - run: cargo run --locked -p site -- build --base /dirk/
      - name: the build produced a site
        run: |
          test -s site/dist/index.html
          test -s site/dist/css/tokens.css
          test -s site/dist/docs/install/index.html
          echo "$(find site/dist -type f | wc -l) files"
