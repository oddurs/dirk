[package]
name = "site"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The generator that builds dirk's website."
publish = false
rust-version = "1.88"

[dependencies]
# Markdown, headings and tables. The hard part of Markdown is a library.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Templates with inheritance, which is the only feature that matters here: one
# base, and pages that fill it in.
minijinja = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# The development server. `make site-serve` should not need python on the path.
tiny_http = "0.12"
